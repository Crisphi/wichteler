{% extends 'base.html' %}
{% block content %}
    <h1>{% block title %}Registrierung{% endblock %}</h1>
    <p>Schön, dass du dich für das diesjährige Wichteln registrieren willst! Falls du bereits ein Konto besitzt, dann geht es hier zum Login: <a href="/login">Anmelden</a></p>

    <form method="post">
      <div class="form-group">
          <label for="title">Name</label>
          <input type="text" name="name" placeholder="Name" class="form-control" value="" maxlength="255" required></input>
      </div>
      <div class="form-group">
          <label for="title">Pronomen</label>
          <input type="text" name="pronouns" placeholder="zb. sie/ihr, xier/xim, keine, alle" class="form-control" value="" maxlength="255"></input>
      </div>
      <div class="form-group">
          <label for="title">E-Mail Adresse</label>
          <input type="email" name="email" placeholder="E-Mail Adresse" class="form-control" value="" maxlength="255" required></input>
      </div>
      <div class="form-group">
          <label for="title">Passwort</label>
          <input type="password" name="password" placeholder="Passwort" class="form-control" value="" maxlength="100" required></input>
      </div>
      <div class="form-group">
          <label for="title">Passwortüberprüfung</label>
          <input type="password" name="password2" placeholder="Passwort" class="form-control" value="" maxlength="100" required></input>
      </div>
      <div class="form-group">
          <label for="title">Anschriftname</label>
          <input type="text" name="shippingname" placeholder="Name für die Zustellung" class="form-control" value="" maxlength="255"></input>
      </div>
      <div class="form-group">
          <label for="title">Straße und Hausnr.</label>
          <input type="text" name="streetandnr" placeholder="Musterstr. 3" class="form-control" value="" maxlength="255"></input>
      </div>
      <div class="form-group">
          <label for="title">Stadt</label>
          <input type="text" name="city" placeholder="Musterstadt" class="form-control" value="" maxlength="255"></input>
      </div>
      <div class="form-group">
          <label for="title">PLZ</label>
          <input type="number" name="plz" placeholder="PLZ" class="form-control" value="" maxlength="255"></input>
      </div>
      <div class="form-group">
          <label for="title">Anmerkungen zum Versand</label>
          <input type="text" name="shippingnotes" placeholder="Anmerkungen" class="form-control" value="" maxlength="255"></input>
      </div>
      <div class="form-group">
          <button type="submit" class="btn btn-primary">Submit</button>
      </div>
    </form>
{% endblock %}
